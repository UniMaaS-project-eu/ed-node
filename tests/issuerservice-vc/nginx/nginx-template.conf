events {
    worker_connections 1024;
}

http {
    # Basic configuration
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Log configuration
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Performance configuration
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Upstream definitions for services
    upstream issuerservice_vc {
        server issuerservicevc:9090;
    }

    server {
        listen 80;
        server_name _;
        root /var/www;
        index index.html;

        # Proxy for API
        location ^~ /api/v1 {
            proxy_pass http://issuerservice_vc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
            
            # Handle preflight requests
            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Length' 0;
                return 204;
            }
        }


        # Specific configuration for DID files (EXACTAMENTE como la original)
        location ~ ^/([^/]+)/\.well-known/did\.json$ {
            try_files $uri =404;

            # CORS headers to allow access from other domains
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type' always;

            # Correct Content-Type for JSON
            add_header 'Content-Type' 'application/json' always;

            # Cache headers for DIDs (can be cached for a while)
            add_header 'Cache-Control' 'public, max-age=3600' always;
        }

        # Alias: also resolve /connectorX/did.json
        location ~ ^/([^/]+)/did\.json$ {
            rewrite ^/([^/]+)/did\.json$ /$1/.well-known/did.json last;
        }

        # Preflight CORS handling (separado como en original)
        location ~ ^/([^/]+)/\.well-known/did\.json$ {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Content-Type';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
        }

        # Simple homepage for debugging
        location = / {
            return 200 'Eclipse EDC DID Resolver\nAvailable endpoints:\n';
            add_header Content-Type text/plain;
        }

        # Health check
        location = /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Specific log for DID requests
        location ~ /\.well-known/ {
            access_log /var/log/nginx/did_access.log;
        }
    }
}
version: "3.5"

services:
  edc-proxy:
    image: nginx:alpine
    hostname: edc-proxy-issuerservicevc
    container_name: edc-proxy-issuerservicevc
    ports:
      - "${NGINX_EXPOSED_PORT:-7000}:80"
    volumes:
      - ./nginx/nginx-${ISSUERSERVICEVC_INSTANCE_NAME}.conf:/etc/nginx/nginx.conf:ro
      - ./assets/dids/${ISSUERSERVICEVC_INSTANCE_NAME}/:/var/www/${ISSUERSERVICEVC_INSTANCE_NAME}/:ro
    networks:
      edc-network:
        aliases:
          - edc-proxy-issuerservicevc
          - proxy-issuerservicevc
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  issuerservicevc:
    build:
      context: ../../
      dockerfile: tests/issuerservice-vc/Dockerfile
    image: unimaas/issuerservice-vc:1.0
    hostname: issuerservicevc
    container_name: issuerservicevc
    restart: always
    environment:
      - ISSUER_DID=${ISSUER_DID}
      - VC_CONTEXT_URL=${VC_CONTEXT_URL}
      - EXPIRY_DAYS=${EXPIRY_DAYS}
    volumes:
      - ./assets/keysPrivPub/${ISSUERSERVICEVC_INSTANCE_NAME}/${ISSUERSERVICEVC_INSTANCE_NAME}_private.pem:/app/keys/issuer_private.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      edc-network:
        aliases:
          - issuerservicevc

networks:
  edc-network:
    name: edc-network

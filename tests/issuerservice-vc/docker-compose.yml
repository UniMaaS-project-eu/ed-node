version: "3.5"

services:
  edc-did-server:
    image: nginx:alpine
    hostname: edc-did-server-issuerservice
    container_name: edc-did-server-issuerservice
    ports:
      - "${ISSUERSERVICE_DID_PORT:-9876}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./assets/dids/:/var/www/:ro
    networks:
      - edc-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  issuerservice-vc:
    build:
      context: ../../
      dockerfile: tests/issuerservice-vc/Dockerfile
    image: unimaas/issuerservice-vc:1.0
    hostname: issuerservice-vc
    container_name: issuerservice-vc
    restart: always
    ports:
      - "${ISSUERSERVICE_PORT}:8080"
    environment:
      - ISSUER_DID=did:web:${ISSUERSERVICE_HOST}%3A${ISSUERSERVICE_DID_PORT}:issuerservice
      - PRIVATE_KEY_PATH=/app/keys/issuer_private.pem
      - EXPIRY_DAYS=${EXPIRY_DAYS}
    volumes:
      - ./assets/keysPrivPub/issuerservice/issuerservice_private.pem:/app/keys/issuer_private.pem:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - edc-network

networks:
  edc-network:
    driver: bridge
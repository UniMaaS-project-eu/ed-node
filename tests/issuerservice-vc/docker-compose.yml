version: "3.5"

services:
  edc-proxy:
    image: nginx:alpine
    hostname: edc-proxy-issuerservicevc
    container_name: edc-proxy-issuerservicevc
    ports:
      - "${NGINX_EXPOSED_PORT:-9876}:80"
    volumes:
      #- ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/nginx-${ISSUERSERVICEVC_INSTANCE_NAME}.conf:/etc/nginx/nginx.conf:ro
      #- ./assets/dids/:/var/www/:ro
      - ./assets/dids/${ISSUERSERVICEVC_INSTANCE_NAME}/:/var/www/${ISSUERSERVICEVC_INSTANCE_NAME}/:ro
    networks:
      - edc-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  issuerservicevc:
    build:
      context: ../../
      dockerfile: tests/issuerservice-vc/Dockerfile
    image: unimaas/issuerservice-vc:1.0
    hostname: issuerservicevc
    container_name: issuerservicevc
    restart: always
#    ports:
#      - "${ISSUERSERVICEVC_PORT}:9090" #DEPRECATED (20250923): External access via NGINX redirects
    environment:
      - ISSUER_DID=${ISSUER_DID}
#      - PRIVATE_KEY_PATH=/app/keys/issuer_private.pem
      - EXPIRY_DAYS=${EXPIRY_DAYS}
    volumes:
      - ./assets/keysPrivPub/${ISSUERSERVICEVC_INSTANCE_NAME}/${ISSUERSERVICEVC_INSTANCE_NAME}_private.pem:/app/keys/issuer_private.pem:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - edc-network

networks:
  edc-network:
    driver: bridge
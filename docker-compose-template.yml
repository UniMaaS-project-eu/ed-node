version: '3.5'

services:
  edc-did-server:
    image: nginx:alpine
    hostname: edc-did-server-${ED_NODE_INSTANCE_NAME}
    container_name: edc-did-server-${ED_NODE_INSTANCE_NAME}
    ports:
      - "${ED_NODE_DID_PORT:-9876}:80"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/assets/dids/:/var/www/:ro
    networks:
      - edc-network-${ED_NODE_INSTANCE_NAME}
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # BBDD PostgreSQL
  edc-postgres-connector:
    image: postgres:15-alpine
    hostname: edc-postgres-${ED_NODE_INSTANCE_NAME}
    container_name: edc-postgres-${ED_NODE_INSTANCE_NAME}
    #ports:
    #  - "5433:5432"
    networks:
      - edc-network-${ED_NODE_INSTANCE_NAME}
    restart: always
    volumes:
      - postgres-data-${ED_NODE_INSTANCE_NAME}:/var/lib/postgresql/data

      # Scripts (Database+Users+Permisions)
      #- ./deployment/sql/01-init-edc-basic.sql:/docker-entrypoint-initdb.d/01-init-edc-basic.sql:ro
      #- ./deployment/sql/02-init-vault-basic.sql:/docker-entrypoint-initdb.d/02-init-vault-basic.sql:ro
      #- ./deployment/sql/03-init-identityhub-basic.sql:/docker-entrypoint-initdb.d/03-init-identityhub.sql:ro

      # Scripts (Database+Users+Permisions+Tables+Indexes...)
      - ./deployment/sql/01-init-edc-all.sql:/docker-entrypoint-initdb.d/01-init-edc-all.sql:ro
      - ./deployment/sql/02-init-vault-all.sql:/docker-entrypoint-initdb.d/02-init-vault-all.sql:ro
      - ./deployment/sql/03-init-identityhub-all.sql:/docker-entrypoint-initdb.d/03-init-identityhub-all.sql:ro

      #- ./backups-restore:/backups-restore
    environment:
      POSTGRES_DB: edc
      POSTGRES_USER: edc_user
      POSTGRES_PASSWORD: edc_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edc_user -d edc"]
      interval: 10s
      timeout: 10s
      retries: 3

  edc-vault-connector:
    image: hashicorp/vault:1.15
    hostname: edc-vault-${ED_NODE_INSTANCE_NAME}
    container_name: edc-vault-${ED_NODE_INSTANCE_NAME}
    #ports:
    #  - "6190:8200"
    networks:
      - edc-network-${ED_NODE_INSTANCE_NAME}
    restart: always
    depends_on:
      - edc-postgres-connector
    environment:
      VAULT_SKIP_VERIFY: "true"  # to avoid SSL conflicts
    volumes:
      - ./deployment/vault/${ED_NODE_INSTANCE_NAME}/vault-${ED_NODE_INSTANCE_NAME}-config.json:/vault/custom/local.json
    cap_add:
      - IPC_LOCK
    #command: "server -config=/vault/config/local.json"
    command: "server -config=/vault/custom/local.json"

  # Initialize/Unseal and save the unseal keys and root token for the Connector
  edc-vault-init-connector:
    build:
      context: .
      dockerfile: launchers/vault-init/Dockerfile.vault-init
    image: unimaas/vault-init:1.0
    hostname: edc-vault-init-${ED_NODE_INSTANCE_NAME}
    container_name: edc-vault-init-${ED_NODE_INSTANCE_NAME}
    depends_on:
      - edc-vault-connector
    networks:
      - edc-network-${ED_NODE_INSTANCE_NAME}
    entrypoint: sh /vault/vault-init.sh http://edc-vault-${ED_NODE_INSTANCE_NAME}:8200 ${ED_NODE_DID} edc-postgres-${ED_NODE_INSTANCE_NAME}:5432

    volumes:
      - ./deployment/vault/vault-init.sh:/vault/vault-init.sh
      - ./deployment/assets/keysPrivPub/${ED_NODE_INSTANCE_NAME}/${ED_NODE_INSTANCE_NAME}_private.pem:/vault/keys/private-key.pem
      - ./deployment/assets/keysPrivPub/${ED_NODE_INSTANCE_NAME}/${ED_NODE_INSTANCE_NAME}_public.pem:/vault/keys/certificate.pem
      - vault-init-data-${ED_NODE_INSTANCE_NAME}:/vault

  # IdentityHub Connector
  ih-connector:
    build:
      context: .
      dockerfile: launchers/identity-hub/src/main/docker/Dockerfile_identityhub
    image: unimaas/edc-identityhub:1.0
    hostname: edc-ih-${ED_NODE_INSTANCE_NAME}
    container_name: edc-ih-${ED_NODE_INSTANCE_NAME}
    ports:
      - "${IH_API_PORT}:7090"
      - "${IH_CREDENTIALS_PORT}:7091"
      - "${IH_IDENTITY_PORT}:7092"
      - "${IH_DID_PORT}:7093"
      - "${IH_VERSION_PORT}:7094"
      - "${IH_STS_PORT}:7095"
    networks:
      - edc-network-${ED_NODE_INSTANCE_NAME}
    restart: always
    depends_on:
      - edc-postgres-connector
      - edc-vault-connector
      - edc-vault-init-connector
    volumes:
      - vault-init-data-${ED_NODE_INSTANCE_NAME}:/vault-token:ro
      - vault-init-data-${ED_NODE_INSTANCE_NAME}:/vault-identityhub-token:ro
    environment:
      - EDC_HOSTNAME=${CONNECTOR_HOST}
      
      # Identity configuration
      - EDC_IAM_ISSUER_ID=${ED_NODE_DID}
      - EDC_IAM_DID_WEB_USE_HTTPS=false
      - EDC_IH_IAM_ID=${ED_NODE_DID}
      - EDC_PARTICIPANT_ID=${ED_NODE_DID}
      
      # Key configuration, environment variables are not used, as they are set in the properties file with:
      # - edc.iam.sts.privatekey.alias=key-1
      # - edc.iam.sts.publickey.id=certificate
      # The 'vault-init.sh' script will assign values ​​to the keys "key-1" and "certificate".
      #- EDC_IAM_STS_PRIVATEKEY_ALIAS=${ED_NODE_DID}-alias
      #- EDC_IAM_STS_PUBLICKEY_ID=${ED_NODE_DID}#key-1
      - EDC_IH_API_SUPERUSER_KEY=${IH_API_KEY}
      
      # STS
      - EDC_IAM_STS_OAUTH_CLIENT_ID=${ED_NODE_DID}
      - EDC_IAM_STS_OAUTH_CLIENT_SECRET_ALIAS=${ED_NODE_DID}-sts-client-secret

      # Logging
      - EDC_LOG_LEVEL=DEBUG
      - EDC_WEB_REST_CORS_ENABLED=true
      - EDC_MONITOR_LEVEL=DEBUG
      
      ########################### Vault Link ###########################
      - EDC_VAULT_HASHICORP_URL=http://edc-vault-${ED_NODE_INSTANCE_NAME}:8200
      - EDC_VAULT_CERTIFICATE_RESOLVER_ENABLED=true
      - EDC_VAULT_PRIVATEKEY_RESOLVER_ENABLED=true

      ########################### IssuerService Link ###########################

      # Types of credentials that will be automatically obtained at startup

      - UNIMAAS_ISSUERSIGNER_PROTOCOL=${UNIMAAS_ISSUERSIGNER_PROTOCOL}
      - UNIMAAS_ISSUERSIGNER_HOST=${UNIMAAS_ISSUERSIGNER_HOST}
      - UNIMAAS_ISSUERSIGNER_PORT=${UNIMAAS_ISSUERSIGNER_PORT}
      - UNIMAAS_ISSUERSIGNER_PATH=${UNIMAAS_ISSUERSIGNER_PATH}

      - UNIMAAS_ISSUERSIGNER_DID=${UNIMAAS_ISSUERSIGNER_DID}

      ########################### IDP-AUTH (KEYCLOAK) Link ###########################

      - UNIMAAS_OIDC_IDP_PROTOCOL=${UNIMAAS_OIDC_IDP_PROTOCOL}
      - UNIMAAS_OIDC_IDP_HOST=${UNIMAAS_OIDC_IDP_HOST}
      - UNIMAAS_OIDC_IDP_PORT=${UNIMAAS_OIDC_IDP_PORT}
      - UNIMAAS_OIDC_IDP_PATH=${UNIMAAS_OIDC_IDP_PATH}
      - UNIMAAS_OIDC_IDP_CLIENT_ID=${UNIMAAS_OIDC_IDP_CLIENT_ID}
      - UNIMAAS_OIDC_IDP_CLIENT_SECRET=${UNIMAAS_OIDC_IDP_CLIENT_SECRET}
      
      ########################### PostgreSQL persistence ###########################
      ###### Connection data is included in Vault via the "vault-init.sh" script. ######
      # BBDD default
      - EDC_DATASOURCE_DEFAULT_NAME=default
      # BBDD IdentityHub
      - EDC_DATASOURCE_IDENTITYHUB_NAME=identityhub      
      # Self-creation of schemas
      - EDC_SQL_SCHEMA_AUTOCREATE=true      
      # Connections Pool
      - EDC_SQL_POOL_CONNECTIONS_MAX=10
      - EDC_SQL_POOL_CONNECTIONS_MIN=3
    #healthcheck:
    #  test: ["CMD-SHELL", "curl -f http://localhost:7093/health || exit 1"]
    #  interval: 30s
    #  timeout: 10s
    #  retries: 3
    #  start_period: 40s

  # Auxiliary service for registering identity contexts and storing secrets (Connector)
  edc-ih-seed-connector:
    build:
      context: .
      dockerfile: launchers/identityhub-seed/Dockerfile.identityhub-seed-participant
    image: unimaas/identityhub-seed-participant:1.0
    hostname: edc-ih-seed-${ED_NODE_INSTANCE_NAME}
    container_name: edc-ih-seed-${ED_NODE_INSTANCE_NAME}
    networks:
      - edc-network-${ED_NODE_INSTANCE_NAME}
    restart: "no"
    depends_on:
      - ih-connector
    volumes:
      - ./deployment/assets/keysPrivPub/${ED_NODE_INSTANCE_NAME}/${ED_NODE_INSTANCE_NAME}_public.pem:/vault/keys/certificate.pem
    environment:
      - PARTICIPANT_ID=${ED_NODE_DID}
      - PARTICIPANT_HOST=${CONNECTOR_HOST}
      - PARTICIPANT_CALLBACK_PORT=${CONNECTOR_CALLBACK_PORT}
      - PARTICIPANT_IH_HOST=${IH_HOST}
      - PARTICIPANT_IH_API_KEY=${IH_API_KEY}
      - PARTICIPANT_IH_API_PORT=${IH_API_PORT}
      - PARTICIPANT_IH_CREDENTIALS_PORT=${IH_CREDENTIALS_PORT}
      - PARTICIPANT_IH_IDENTITY_PORT=${IH_IDENTITY_PORT}

  connector:
    build:
      context: .
      dockerfile: launchers/connector/src/main/docker/Dockerfile_connector
    image: unimaas/edc-connector:1.0
    hostname: edc-connector-${ED_NODE_INSTANCE_NAME}
    container_name: edc-connector-${ED_NODE_INSTANCE_NAME}
    ports:
      - "${CONNECTOR_API_PORT}:8080"
      - "${CONNECTOR_API_MANAGEMENT_PORT}:8081"
      - "${CONNECTOR_CALLBACK_PORT}:8082"
      - "${CONNECTOR_API_CONTROL_PORT}:8083"
      - "${CONNECTOR_CATALOG_PORT}:8084"
      - "${CONNECTOR_VERSION_PORT}:8085"
      - "${CONNECTOR_PUBLIC_API_PORT}:11001"
      - "${CONNECTOR_DATAPLANE_PUBLIC_PORT}:9091"
      - "${CONNECTOR_DATAPLANE_SIGNALING_PORT}:9092"
    networks:
      - edc-network-${ED_NODE_INSTANCE_NAME}
    restart: always
    depends_on:
      - edc-postgres-connector
      - edc-vault-connector
      - edc-vault-init-connector
      - ih-connector
      - edc-ih-seed-connector
    volumes:
      - vault-init-data-${ED_NODE_INSTANCE_NAME}:/vault-token:ro
    environment:
      - EDC_HOSTNAME=${CONNECTOR_HOST}

      # Identity configuration - same as IdentityHub
      - EDC_IAM_ISSUER_ID=${ED_NODE_DID}
      - EDC_IAM_DID_WEB_USE_HTTPS=false
      - EDC_PARTICIPANT_ID=${ED_NODE_DID}

      # Key configuration, environment variables are not used, as they are set in the properties file with:
      # - edc.iam.sts.privatekey.alias=key-1
      # - edc.iam.sts.publickey.id=certificate
      # The 'vault-init.sh' script will assign values ​​to the keys "key-1" and "certificate".
      #- EDC_IAM_STS_PRIVATEKEY_ALIAS=${ED_NODE_DID}-alias
      #- EDC_IAM_STS_PUBLICKEY_ID=${ED_NODE_DID}#key-1
      - EDC_IH_API_SUPERUSER_KEY=${CONNECTOR_IH_API_KEY}

      # DSP
      - EDC_DSP_CALLBACK_ADDRESS=http://${CONNECTOR_HOST}:${CONNECTOR_CALLBACK_PORT}/api/dsp
      #- EDC_WEB_HTTP_PROTOCOL_PORT=${CONNECTOR_CALLBACK_PORT}
      
      # STS - point at IdentityHub
      - EDC_IAM_STS_OAUTH_CLIENT_ID=${ED_NODE_DID}
      - EDC_IAM_STS_OAUTH_CLIENT_SECRET_ALIAS=${ED_NODE_DID}-sts-client-secret
      - EDC_IAM_STS_OAUTH_TOKEN_URL=http://edc-ih-${ED_NODE_INSTANCE_NAME}:7095/api/sts/token

      # Token Verification and Signing Configuration
      #- EDC_TRANSFER_PROXY_TOKEN_SIGNER_PRIVATEKEY_ALIAS=${ED_NODE_DID}-alias
      #- EDC_TRANSFER_PROXY_TOKEN_VERIFIER_PUBLICKEY_ALIAS=${ED_NODE_DID}#key-1

      # IdentityHub
      - EDC_IAM_IDENTITYHUB_URL=http://edc-ih-${ED_NODE_INSTANCE_NAME}:7093
      - EDC_IAM_IDENTITYHUB_DID=${ED_NODE_DID}

      # =================== DATAPLANE CONFIGURATION ===================
      # dataplane URLs
      - EDC_DATAPLANE_API_PUBLIC_BASEURL=http://${ED_NODE_INSTANCE_NAME}:9091/public
      - EDC_DATAPLANE_SIGNALING_API_URL=http://${ED_NODE_INSTANCE_NAME}:9092/api/signaling
      
      # Token validation endpoint
      - EDC_DATAPLANE_TOKEN_VALIDATION_ENDPOINT=http://${ED_NODE_INSTANCE_NAME}:8083/api/control/v3/dataplane/token
      - EDC_CONTROLPLANE_VALIDATION_ENDPOINT=http://${ED_NODE_INSTANCE_NAME}:8083/api/control/v3/dataplane/token
      
      # Public transfer endpoint
      - EDC_TRANSFER_PROXY_ENDPOINT=http://${CONNECTOR_HOST}:${CONNECTOR_PUBLIC_API_PORT}/public
      - EDC_DATAPLANE_PROXY_PUBLIC_ENDPOINT=http://${CONNECTOR_HOST}:${CONNECTOR_PUBLIC_API_PORT}/public
      
      # Dataplane instance ID
      - EDC_DATAPLANE_API_INSTANCE_ID=${ED_NODE_DID}
      
      # Control plane selector URL (for dataplane registration CP)
      - EDC_DPF_SELECTOR_URL=http://${ED_NODE_INSTANCE_NAME}:8083/api/control/v3/dataplanes
      # ====================================================================

      # Logging
      - EDC_LOG_LEVEL=DEBUG
      - EDC_WEB_REST_CORS_ENABLED=true
      - EDC_MONITOR_LEVEL=DEBUG

      ########################### IssuerService Link ###########################
      - UNIMAAS_ISSUERSIGNER_DID=${UNIMAAS_ISSUERSIGNER_DID}

      ########################### Require extra VC for CatalogRequest ###########################

      - UNIMAAS_ENABLE_EXTRA_VP_CATALOGREQUEST=${CONNECTOR_UNIMAAS_ENABLE_EXTRA_VP_CATALOGREQUEST}

      ########################### Vault Link ###########################
      - EDC_VAULT_HASHICORP_URL=http://edc-vault-${ED_NODE_INSTANCE_NAME}:8200

      # Since there is a dynamic token acquisition approach that stores the token value in edc.vault.hashicorp.token (see entrypoint) it no longer makes sense to define the parameter
      # EDC_VAULT_HASHICORP_TOKEN_FILE which is to indicate the file where said value is statically.
      # If this were to be touched it would be necessary:
      # a) define - EDC_VAULT_HASHICORP_TOKEN_FILE=/vault-token/token
      # b) no use -Dedc.vault.hashicorp.token in entrypoint

      #- EDC_VAULT_HASHICORP_TOKEN= It is read dynamically through the connector entrypoint and the volume.
      #- EDC_VAULT_HASHICORP_API_SECRET_PATH= At the moment there is no choice and it takes the configuration file (edc.vault.hashicorp.api.secret.path) by default.
      - EDC_VAULT_CERTIFICATE_RESOLVER_ENABLED=true
      - EDC_VAULT_PRIVATEKEY_RESOLVER_ENABLED=true

      ########################### PostgreSQL persistence ###########################
      ###### Connection data is included in Vault via the "vault-init.sh" script. ######
      # BBDD default
      - EDC_DATASOURCE_DEFAULT_NAME=default
      # BBDD Assets
      - EDC_DATASOURCE_ASSET_NAME=asset
      # BBDD contractdefinition
      - EDC_DATASOURCE_CONTRACTDEFINITION_NAME=contractdefinition
      # BBDD policy
      - EDC_DATASOURCE_POLICY_NAME=policy
      # BBDD contractnegotiation
      - EDC_DATASOURCE_CONTRACTNEGOTIATION_NAME=contractnegotiation
      #  BBDD ransferprocess
      - EDC_DATASOURCE_TRANSFERPROCESS_NAME=transferprocess
      # Self-creation of schemas
      - EDC_SQL_SCHEMA_AUTOCREATE=true
      # Connections Pool
      - EDC_SQL_POOL_CONNECTIONS_MAX=10
      - EDC_SQL_POOL_CONNECTIONS_MIN=3

volumes:
  postgres-data-${ED_NODE_INSTANCE_NAME}:
  vault-init-data-${ED_NODE_INSTANCE_NAME}:

networks:
 edc-network-${ED_NODE_INSTANCE_NAME}:
    driver: bridge
